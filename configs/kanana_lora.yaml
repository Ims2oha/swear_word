seed: 42

data:
  kotox_repo: ssgyejin/KOTOX
  kotox_files:
    train: data/total/train.csv
    valid: data/total/valid.csv
    test: data/total/test.csv
  kda_repo: minkyeongjeon/kda-dataset
  kda_file: kda_ko.csv
  raw_dir: data/raw
  processed_dir: data/processed
  min_len: 2
  max_len: 200
  identity_max_frac: 0.25      # 각 split에서 identity(정상->정상) 쌍 최대 비율
  kda_split: [0.9, 0.05, 0.05] # KOTOX와 안 겹치는 K/DA 문장 그룹의 train/valid/test 비율
  augment:                     # 어휘 사전으로 만드는 합성 쌍 (사전에 없는 욕설을 지우지 않고 순화하게)
    enabled: true
    lexicon: configs/lexicon.tsv
    n: {train: 6000, valid: 400, test: 400}
  extra_pairs: data/llm_pairs/llm_pairs.jsonl  # 로컬 LLM 생성 쌍 (src/build_llm_pairs.py). 없으면 건너뜀
  identity_extra:              # 깨끗한 문장을 고치거나 뒷부분을 지우는 걸 줄이려고 identity 비중을 올린다
    from_llm_targets: true     # LLM 쌍의 정답을 identity(정답->정답)로도 넣기
    train_repeat: 2            # train 의 identity 를 이 횟수만큼 반복 (valid/test 는 그대로)

model:
  # 카카오 Kanana-1.5 2.1B Instruct (Apache-2.0, Llama 구조). 공개·배포가 자유로운 베이스.
  # transformers 5.4+ 에서 config 검사에 걸리는 문제는 src/llm_common.py 에서 우회한다.
  name: kakaocorp/kanana-1.5-2.1b-instruct-2505
  trust_remote_code: false
  max_seq_len: 320
  max_new_tokens: 96
  prompt: "다음 문장에서 욕설·비속어·혐오 표현을 순화해서 다시 써줘. 이미 깨끗한 문장은 그대로 써줘.\n문장: {text}"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Llama 레이어 이름: 어텐션 q/k/v/o_proj, MLP gate/up/down_proj
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  output_dir: outputs/kanana-lora
  lr: 2.0e-4
  epochs: 3
  batch_size: 8                      # 12GB 기준. OOM 이면 4 로, grad_accum 은 8 로
  grad_accum: 4                      # 실질 배치 = batch_size * grad_accum = 32
  warmup_ratio: 0.03
  weight_decay: 0.0
  save_steps: 100                    # 100 step 마다 평가+체크포인트 저장 (꺼져도 --resume)
  patience: 5                        # 평가 5번 연속 개선 없으면 중단 (평가가 100 step 단위라 넉넉하게)
  precision: auto                    # auto = bf16 지원 GPU 면 bf16, 아니면 fp16

eval:
  batch_size: 16

bot:                           # src/moderate.py (봇 판단). src/eval_moderate.py 로 테스트셋에서 확인
  lexicon: configs/lexicon.tsv
  prefilter: false             # true = 사전 욕설·변형 흔적이 없는 메시지는 모델에 안 넣고 통과. false = 모든 메시지를 모델에
  obfuscation_check: true      # 1차 필터에서 변형 흔적(낱자모·특수기호·한영 붙여쓰기·한자)이 있으면 모델로 보냄
  self_check: true             # 순화 결과를 모델에 다시 넣어 또 바뀌면 더 순화 (단어 목록 없이 모델 판단으로 잔존 검사)
  max_passes: 3                # 메시지당 모델 최대 호출 수. self_check 에서 이 안에 결과가 안정되지 않으면 block
  on_residual: mask            # 순화 후에도 확실한 욕이 남으면 mask = 그 부분만 **로 가려서 올림, block = 삭제
  min_similarity: 30           # chrF(순화 결과, 욕 뺀 원문)가 이보다 낮으면 다시 올리지 않음 (지어낸 문장 방지)
