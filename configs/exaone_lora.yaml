seed: 42

data:
  processed_dir: data/processed      # prepare_data.py 결과를 KoBART와 같이 쓴다

model:
  name: LGAI-EXAONE/EXAONE-3.5-2.4B-Instruct
  trust_remote_code: true            # EXAONE 3.5 는 커스텀 코드 필요
  max_seq_len: 320
  max_new_tokens: 96
  prompt: "다음 문장에서 욕설·비속어·혐오 표현을 순화해서 다시 써줘. 이미 깨끗한 문장은 그대로 써줘.\n문장: {text}"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # EXAONE 레이어 이름: 어텐션 q/k/v/out_proj, MLP c_fc_0/c_fc_1/c_proj
  target_modules: [q_proj, k_proj, v_proj, out_proj, c_fc_0, c_fc_1, c_proj]

train:
  output_dir: outputs/exaone-lora
  lr: 2.0e-4
  epochs: 3
  batch_size: 8                      # 12GB 기준. OOM 이면 4 로, grad_accum 은 8 로
  grad_accum: 4                      # 실질 배치 = batch_size * grad_accum = 32
  warmup_ratio: 0.03
  weight_decay: 0.0
  patience: 2
  precision: auto                    # auto = bf16 지원 GPU 면 bf16, 아니면 fp16

eval:
  batch_size: 16
