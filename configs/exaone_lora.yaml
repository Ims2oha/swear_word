seed: 42

data:
  kotox_repo: ssgyejin/KOTOX
  kotox_files:
    train: data/total/train.csv
    valid: data/total/valid.csv
    test: data/total/test.csv
  kda_repo: minkyeongjeon/kda-dataset
  kda_file: kda_ko.csv
  raw_dir: data/raw
  processed_dir: data/processed
  min_len: 2
  max_len: 200
  identity_max_frac: 0.25      # 각 split에서 identity(정상->정상) 쌍 최대 비율
  kda_split: [0.9, 0.05, 0.05] # KOTOX와 안 겹치는 K/DA 문장 그룹의 train/valid/test 비율
  augment:                     # 어휘 사전으로 만드는 합성 쌍 (사전에 없는 욕설을 지우지 않고 순화하게)
    enabled: true
    lexicon: configs/lexicon.tsv
    n: {train: 6000, valid: 400, test: 400}
  extra_pairs: data/llm_pairs/llm_pairs.jsonl  # 로컬 LLM 생성 쌍 (src/build_llm_pairs.py). 없으면 건너뜀

model:
  # EXAONE-3.5-2.4B-Instruct 를 표준 Llama 구조로 변환한 판 (같은 가중치·토크나이저·챗 템플릿).
  # 원본(LGAI-EXAONE/...)은 커스텀 코드가 transformers 버전과 안 맞아서 쓰지 않는다.
  name: beomi/EXAONE-3.5-2.4B-Instruct-Llamafied
  trust_remote_code: false
  max_seq_len: 320
  max_new_tokens: 96
  prompt: "다음 문장에서 욕설·비속어·혐오 표현을 순화해서 다시 써줘. 이미 깨끗한 문장은 그대로 써줘.\n문장: {text}"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Llama 레이어 이름: 어텐션 q/k/v/o_proj, MLP gate/up/down_proj
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  output_dir: outputs/exaone-lora
  lr: 2.0e-4
  epochs: 3
  batch_size: 8                      # 12GB 기준. OOM 이면 4 로, grad_accum 은 8 로
  grad_accum: 4                      # 실질 배치 = batch_size * grad_accum = 32
  warmup_ratio: 0.03
  weight_decay: 0.0
  save_steps: 100                    # 100 step 마다 평가+체크포인트 저장 (꺼져도 --resume)
  patience: 5                        # 평가 5번 연속 개선 없으면 중단 (평가가 100 step 단위라 넉넉하게)
  precision: auto                    # auto = bf16 지원 GPU 면 bf16, 아니면 fp16

eval:
  batch_size: 16
